[package]
name = "game-simulator"
version.workspace = true
edition.workspace = true
description = "Headless game logic simulator"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }
log = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
indexmap = "2.0"
env_logger = "0.11"  # For examples

[dev-dependencies]
tempfile = "3"


