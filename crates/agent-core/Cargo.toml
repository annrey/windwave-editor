[package]
name = "agent-core"
version.workspace = true
edition.workspace = true
description = "Agent interface layer - core types and context management"

[dependencies]
serde = { workspace = true }
serde_json = "1.0"
toml = "0.8"
thiserror = { workspace = true }
async-trait = "0.1"
tokio = { version = "1.0", features = ["time", "sync", "macros", "rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"], optional = true }
regex = "1.10"
crossbeam = { version = "0.8", features = ["crossbeam-channel"] }
log = { workspace = true }
walkdir = "2.5"
once_cell = "1.19"
dirs = "5.0"
glob = "0.3"
ai-frameworks = { workspace = true, optional = true }
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
tokio-stream = { version = "0.1", optional = true }
png = "0.17"

[features]
default = ["llm-openai", "llm-claude", "engine-http"]
llm-openai = ["reqwest"]
llm-claude = ["reqwest"]
engine-http = ["reqwest"]
ai-frameworks = ["dep:ai-frameworks"]
http-api = ["axum", "tower", "tower-http", "tokio-stream", "tokio/rt-multi-thread"]

[dev-dependencies]
serde_json = "1.0"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "memory_bench"
harness = false

[[bench]]
name = "bm25_bench"
harness = false

[[bench]]
name = "tool_bench"
harness = false
