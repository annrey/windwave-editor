[package]
name = "ai-frameworks"
version.workspace = true
edition.workspace = true
description = "Integrations for LangChain, LlamaIndex, and DSPy AI frameworks"
autoexamples = false
publish = false

[[example]]
name = "ai_frameworks_basic_usage"
path = "examples/basic_usage.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }
async-trait = "0.1"
tokio = { version = "1.0", features = ["time", "sync", "macros", "rt-multi-thread"] }
log = { workspace = true }
walkdir = "2"
uuid = { version = "1.0", features = ["v4"] }
chrono = { workspace = true }

[dev-dependencies]
tempfile = "3"
env_logger = "0.11"
tokio = { version = "1.0", features = ["full"] }
